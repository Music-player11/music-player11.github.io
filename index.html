// ========================
// ALGORITHM
// ========================

function calculateScore(song){

let L = song.liked ? 1 : 0;

let R = song.listenTime / song.duration;
if(R > 1) R = 1;

let Replay = Math.max(0, song.playCount - 1);

let CompletionBonus = R > 0.9 ? 2 : 0;

let Score =
6 * L +
8 * R +
4 * Replay +
2 * CompletionBonus;

return Score;

}


// ========================
// SORT FEED
// ========================

function sortFeed(){

songs.sort((a,b)=>{

return calculateScore(b) - calculateScore(a);

});

}


// ========================
// BUILD UI
// ========================

let feed = document.getElementById("feed");

function buildFeed(){

feed.innerHTML = "";

songs.forEach(song=>{

let div = document.createElement("div");

div.className =
"song flex flex-col justify-end p-6 text-white relative";

div.innerHTML = `

<div class="absolute inset-0 bg-gradient-to-b from-black/30 to-black/90"></div>

<div class="relative z-10">

    <img
src="${song.cover}"
class="w-20 h-20 rounded-full object-cover border border-white/30 mb-2"
/>

<h1 class="text-2xl font-bold">${song.title}</h1>

<p class="text-gray-300">${song.artist}</p>

<p class="mt-3 text-lg">${song.message}</p>

<div class="flex items-center gap-4 mt-6">

<button
onclick="toggleLike(${song.id})"
class="text-3xl"
>
${song.liked ? "❤️" : "🤍"}
</button>

<button
onclick="togglePlay(${song.id})"
class="text-2xl"
>
▶️
</button>

</div>

</div>

<audio id="audio-${song.id}" src="${song.src}"></audio>

`;

feed.appendChild(div);

});

}


// ========================
// LIKE
// ========================

function toggleLike(id){

let song = songs.find(s=>s.id==id);

song.liked = !song.liked;

sortFeed();

buildFeed();

}


// ========================
// PLAY
// ========================

let currentAudio = null;
let currentSong = null;
let listenInterval = null;

function togglePlay(id){

let audio = document.getElementById("audio-"+id);

let song = songs.find(s=>s.id==id);

if(currentAudio && currentAudio != audio){

currentAudio.pause();

clearInterval(listenInterval);

}

if(audio.paused){

audio.play();

song.playCount++;

currentAudio = audio;

currentSong = song;

listenInterval = setInterval(()=>{

song.listenTime++;

},1000);

}
else{

audio.pause();

clearInterval(listenInterval);

}

}


// ========================
// AUTO PLAY ON SCROLL
// ========================

let observer = new IntersectionObserver(entries=>{

entries.forEach(entry=>{

let audio = entry.target.querySelector("audio");

let id = parseInt(audio.id.split("-")[1]);

let song = songs.find(s=>s.id==id);

if(entry.isIntersecting){

audio.play();

song.playCount++;

currentAudio = audio;

currentSong = song;

listenInterval = setInterval(()=>{

song.listenTime++;

},1000);

}
else{

audio.pause();

clearInterval(listenInterval);

}

});

},{
threshold: 0.7
});

// ========================
// INIT
// ========================

function init(){

sortFeed();

buildFeed();

setTimeout(()=>{

document.querySelectorAll(".song").forEach(el=>{

observer.observe(el);

});

},100);

}

init();

</script>
